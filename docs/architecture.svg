<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 682" width="960" height="682" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
    <marker id="arwAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf8700"/>
    </marker>
    <style>
      .card  { fill:#f6f8fa; stroke:#d0d7de; stroke-width:1.5; rx:8; }
      .lane  { fill:#ffffff; stroke:#d0d7de; stroke-width:1.5; rx:12; }
      .t     { fill:#1f2328; font-size:14px; font-weight:600; }
      .s     { fill:#656d76; font-size:11.5px; }
      .h     { fill:#1f2328; font-size:19px; font-weight:700; }
      .sub   { fill:#656d76; font-size:12.5px; }
      .flow  { stroke:#8c959f; stroke-width:1.6; fill:none; }
      .amber { stroke:#bf8700; stroke-width:1.6; fill:none; stroke-dasharray:5 4; }
    </style>
  </defs>

  <rect width="960" height="682" fill="#ffffff"/>

  <text x="34" y="38" class="h">회사 규정 QA — RAG 파이프라인</text>
  <text x="34" y="59" class="sub">사내 취업규칙 DOCX를 조(條) 단위로 색인하고, 근거 조항만으로 답하는 로컬 전용 QA 시스템</text>

  <!-- ================= PHASE A : INDEXING ================= -->
  <rect x="24" y="82" width="912" height="146" class="lane"/>
  <rect x="24" y="82" width="6" height="146" fill="#0969da" rx="3"/>
  <text x="44" y="106" class="t" style="fill:#0969da">① 색인 (오프라인 · build_index.py)</text>

  <rect x="46" y="122" width="128" height="62" class="card"/>
  <text x="110" y="146" class="t" text-anchor="middle">사규 DOCX</text>
  <text x="110" y="165" class="s" text-anchor="middle">취업규칙 31개 조</text>
  <line x1="178" y1="153" x2="200" y2="153" class="flow" marker-end="url(#arw)"/>

  <rect x="204" y="122" width="128" height="62" class="card"/>
  <text x="268" y="146" class="t" text-anchor="middle">loader</text>
  <text x="268" y="165" class="s" text-anchor="middle">문단 + 표를 순서대로</text>
  <line x1="336" y1="153" x2="358" y2="153" class="flow" marker-end="url(#arw)"/>

  <rect x="362" y="122" width="128" height="62" class="card"/>
  <text x="426" y="146" class="t" text-anchor="middle">chunker</text>
  <text x="426" y="165" class="s" text-anchor="middle">제N조 단위 분할</text>
  <line x1="494" y1="153" x2="516" y2="153" class="flow" marker-end="url(#arw)"/>

  <rect x="520" y="122" width="128" height="62" class="card"/>
  <text x="584" y="146" class="t" text-anchor="middle">embedder</text>
  <text x="584" y="165" class="s" text-anchor="middle">bge-m3 · 1024차원</text>
  <line x1="652" y1="153" x2="674" y2="153" class="flow" marker-end="url(#arw)"/>

  <rect x="678" y="122" width="128" height="62" class="card" style="fill:#ddf4ff;stroke:#54aeff"/>
  <text x="742" y="143" class="t" text-anchor="middle" style="fill:#0a3069">index/</text>
  <text x="742" y="160" class="s" text-anchor="middle" style="fill:#0a3069">vectors.npy</text>
  <text x="742" y="176" class="s" text-anchor="middle" style="fill:#0a3069">chunks.json</text>
  <text x="816" y="157" class="s">31 × 1024 float32</text>

  <!-- ================= PHASE B : QUERY ================= -->
  <rect x="24" y="248" width="912" height="410" class="lane"/>
  <rect x="24" y="248" width="6" height="410" fill="#8250df" rx="3"/>
  <text x="44" y="272" class="t" style="fill:#8250df">② 질의 (런타임 · app.py / ask.py)</text>

  <rect x="46" y="290" width="150" height="62" class="card"/>
  <text x="121" y="314" class="t" text-anchor="middle">사용자 질문</text>
  <text x="121" y="333" class="s" text-anchor="middle">"연차 며칠 써?"</text>
  <line x1="200" y1="321" x2="224" y2="321" class="flow" marker-end="url(#arw)"/>

  <rect x="228" y="290" width="176" height="62" class="card"/>
  <text x="316" y="314" class="t" text-anchor="middle">condense_query</text>
  <text x="316" y="333" class="s" text-anchor="middle">후속질문 → 독립 질문</text>
  <line x1="408" y1="321" x2="432" y2="321" class="flow" marker-end="url(#arw)"/>

  <rect x="436" y="290" width="176" height="62" class="card"/>
  <text x="524" y="314" class="t" text-anchor="middle">벡터 검색</text>
  <text x="524" y="333" class="s" text-anchor="middle">코사인 유사도 top-k</text>
  <line x1="616" y1="321" x2="640" y2="321" class="flow" marker-end="url(#arw)"/>

  <rect x="644" y="290" width="176" height="62" class="card"/>
  <text x="732" y="314" class="t" text-anchor="middle">근거 조항 k개</text>
  <text x="732" y="333" class="s" text-anchor="middle">+ 유사도 점수</text>

  <!-- index feeds search -->
  <path d="M 742 190 L 742 214 L 524 214 L 524 284" class="flow" marker-end="url(#arw)"/>
  <text x="600" y="208" class="s">색인 로드 (1회, 캐시)</text>

  <!-- down to prompt assembly -->
  <path d="M 732 356 L 732 380 L 620 380 L 620 402" class="flow" marker-end="url(#arw)"/>

  <!-- code-computed facts -->
  <rect x="46" y="392" width="196" height="76" class="card" style="fill:#fff8c5;stroke:#d4a72c"/>
  <text x="144" y="416" class="t" text-anchor="middle" style="fill:#7d4e00">leave.py — 코드 계산</text>
  <text x="144" y="436" class="s" text-anchor="middle" style="fill:#7d4e00">입사일 → 연차 일수</text>
  <text x="144" y="454" class="s" text-anchor="middle" style="fill:#7d4e00">LLM에게 산수를 안 시킴</text>
  <path d="M 246 430 L 434 430" class="amber" marker-end="url(#arwAmber)"/>

  <!-- prompt assembly -->
  <rect x="440" y="406" width="360" height="76" class="card"/>
  <text x="620" y="430" class="t" text-anchor="middle">프롬프트 조립</text>
  <text x="620" y="450" class="s" text-anchor="middle">시스템 규칙 + 오늘 날짜 + 규정 컨텍스트</text>
  <text x="620" y="468" class="s" text-anchor="middle">+ 코드 계산 사실 + 대화 이력</text>

  <line x1="620" y1="486" x2="620" y2="510" class="flow" marker-end="url(#arw)"/>

  <!-- LLM -->
  <rect x="440" y="514" width="360" height="64" class="card" style="fill:#fbefff;stroke:#c297ff"/>
  <text x="620" y="539" class="t" text-anchor="middle" style="fill:#6639ba">Ollama · qwen2.5:7b</text>
  <text x="620" y="559" class="s" text-anchor="middle" style="fill:#6639ba">완전 로컬 추론 — 사규가 외부로 나가지 않음</text>

  <!-- confidence guard -->
  <rect x="46" y="500" width="196" height="78" class="card" style="fill:#ffebe9;stroke:#ff8182"/>
  <text x="144" y="524" class="t" text-anchor="middle" style="fill:#a40e26">신뢰도 가드</text>
  <text x="144" y="544" class="s" text-anchor="middle" style="fill:#a40e26">최고 유사도 &lt; 0.5 이면</text>
  <text x="144" y="562" class="s" text-anchor="middle" style="fill:#a40e26">"근거 못 찾음" 경고</text>
  <path d="M 246 546 L 434 546" class="flow" stroke-dasharray="5 4" marker-end="url(#arw)"/>

  <!-- outputs -->
  <path d="M 620 578 L 620 594 L 420 594 L 420 604" class="flow" marker-end="url(#arw)"/>
  <path d="M 620 594 L 620 604" class="flow" marker-end="url(#arw)"/>
  <path d="M 620 594 L 820 594 L 820 604" class="flow" marker-end="url(#arw)"/>

  <rect x="330" y="608" width="180" height="40" class="card"/>
  <text x="420" y="633" class="t" text-anchor="middle">답변 + (제N조)</text>

  <rect x="530" y="608" width="180" height="40" class="card"/>
  <text x="620" y="633" class="t" text-anchor="middle">근거 원문 펼치기</text>

  <rect x="730" y="608" width="180" height="40" class="card"/>
  <text x="820" y="633" class="t" text-anchor="middle">감사 로그 (JSONL)</text>
</svg>
